
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseflow-ai"
version = "0.1.0"
description = "Agentic AI-powered Hospital IT Support Ticket Management System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }


dependencies = [
    "SQLAlchemy>=2.1,<3.0",
    "alembic>=1.20,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "python-dotenv>=1.1,<2.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "langchain-text-splitters>=1.0,<2.0",
    "sentence-transformers>=5.0,<6.0",
    "chromadb>=1.0,<2.0",
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
    "pwdlib[argon2]==0.4.2",
    "PyJWT==2.15.1",
    "python-multipart==0.0.34",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

